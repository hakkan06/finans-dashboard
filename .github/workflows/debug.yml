name: Debug Backup
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/debug.yml'
jobs:
  debug:
    runs-on: [self-hosted, linux]
    steps:
      - name: Debug
        run: |
          kubectl delete job manual-backup-1 || true
          kubectl create job --from=cronjob/database-gdrive-backup manual-backup-1
          sleep 10
          kubectl get pods -l job-name=manual-backup-1
          kubectl logs -l job-name=manual-backup-1 || true
          kubectl describe job manual-backup-1 || true
