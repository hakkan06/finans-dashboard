server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Arayüz → backend. Önek (/api) kaldırılarak iletilir.
    location /api/ {
        proxy_pass http://finans-backend-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fiyat güncelleme dış kaynaklardan çektiği için uzun sürebilir
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Dosya adlarında içerik özeti (hash) olduğu için uzun süre önbelleğe alınabilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
