apiVersion: batch/v1
kind: CronJob
metadata:
  name: database-gdrive-backup
  namespace: default
spec:
  # TR Saati ile 03:00 (UTC 00:00)
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: db-backup
            image: db-backup:latest
            imagePullPolicy: IfNotPresent
            env:
            # Finans DB Env
            - name: FINANS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: finans-db-secret
                  key: db_user
            - name: FINANS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finans-db-secret
                  key: db_password
            - name: FINANS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: finans-db-secret
                  key: db_name
            # Mooddiary DB Env
            - name: MOODDIARY_DB_USER
              valueFrom:
                secretKeyRef:
                  name: finans-db-secret
                  key: mooddiary_db_user
            - name: MOODDIARY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finans-db-secret
                  key: mooddiary_db_password
            - name: MOODDIARY_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: finans-db-secret
                  key: mooddiary_db_name
            volumeMounts:
            - name: rclone-config-volume
              mountPath: /root/.config/rclone
              readOnly: true
          volumes:
          - name: rclone-config-volume
            secret:
              secretName: rclone-config
          restartPolicy: OnFailure
