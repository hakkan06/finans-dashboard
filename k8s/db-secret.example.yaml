apiVersion: v1
kind: Secret
metadata:
  name: finans-db-secret
  namespace: default
type: Opaque
stringData:
  # --- Finans DB ---
  db_user: "YOUR_DB_USER"
  db_password: "YOUR_STRONG_PASSWORD"
  db_name: "finans_db"
  # --- Mooddiary DB (backup-cronjob için) ---
  mooddiary_db_user: "YOUR_MOODDIARY_USER"
  mooddiary_db_password: "YOUR_MOODDIARY_PASSWORD"
  mooddiary_db_name: "mooddiary"

# KULLANIM:
#   1. Bu dosyayı kopyala: cp db-secret.example.yaml db-secret.yaml
#   2. db-secret.yaml içini gerçek şifrelerle doldur
#   3. Cluster'a bir kez uygula: kubectl apply -f k8s/db-secret.yaml
#   4. db-secret.yaml dosyasını ASLA git'e commit etme (.gitignore'da mevcut)
