apiVersion: apps/v1
kind: Deployment
metadata:
  name: finans-backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finans-backend
  template:
    metadata:
      labels:
        app: finans-backend
    spec:
      containers:
      - name: finans-backend
        image: finans-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        env:
        - name: TZ
          value: "Europe/Istanbul"
        - name: DB_HOST
          value: "finans-postgres-service"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: finans-db-secret
              key: db_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: finans-db-secret
              key: db_password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: finans-db-secret
              key: db_name
        - name: MAIL_USER
          valueFrom:
            secretKeyRef:
              name: finans-mail-secret
              key: mail_user
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: finans-mail-secret
              key: mail_password

---
apiVersion: v1
kind: Service
metadata:
  name: finans-backend-service
spec:
  selector:
    app: finans-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000