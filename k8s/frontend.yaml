apiVersion: apps/v1
kind: Deployment
metadata:
  name: finans-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finans-frontend
  template:
    metadata:
      labels:
        app: finans-frontend
    spec:
      containers:
      - name: finans-frontend
        image: finans-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: finans-frontend-service
spec:
  selector:
    app: finans-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
